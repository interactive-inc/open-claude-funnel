name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun run lint
      - run: make check
      - run: make build
      - name: Compose SDK input and Channels notifications in Node
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { Funnel } from "./dist/index.js";
          import { agentSdkInput, claudeChannelNotification } from "./dist/claude.js";
          const gateway = new Funnel({ channels: [{ name: "smoke" }] }).gatewayModule({ token: "" });
          const events = gateway.events({ channel: "smoke" });
          const input = agentSdkInput(events);
          gateway.emit({ channel: "smoke", content: "ok" });
          assert.equal(JSON.parse((await input.next()).value.message.content).content, "ok");
          assert.equal(claudeChannelNotification({ content: "ok", offset: 1 }).params.meta.funnel_offset, "1");
          const pending = input.next();
          await gateway.stop();
          assert.equal((await pending).done, true);
          await input.return();
          JS
