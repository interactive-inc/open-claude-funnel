name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: bun run check:package
      - name: Compose SDK input and Channels notifications in Node
        run: node scripts/check-node-composition.mjs
      - name: Use minimum supported Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - name: Check all tests on minimum Bun runtime
        run: bun scripts/check-minimum-bun.mjs
      - name: Use minimum supported Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22.0.0
      - name: Compose SDK input and Channels notifications on minimum Node.js
        run: node scripts/check-node-composition.mjs
