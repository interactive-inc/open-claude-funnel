name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun run lint
      - run: make check
      - run: make build
      - name: Import the library in Node without Bun or SQLite
        run: |
          node --input-type=module -e 'import { Funnel } from "./dist/index.js"; const f = new Funnel({ channels: [{ name: "smoke" }] }); const g = f.gatewayModule({ token: "smoke" }); g.emit({ channel: "smoke", content: "ok" }); await g.stop();'
